<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VZ // ACCESS TERMINAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fix.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;700&display=swap');
        
        :root {
            --bg: #000000;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text: #e0e0e0;
            --text-dim: #808080;
            --accent: #8b0000;
            --accent-bright: #ff0000;
            --border: #1a1a1a;
            --font-main: 'IBM Plex Mono', 'Courier New', monospace;
            --font-term: 'VT323', 'Courier New', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: var(--text);
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            cursor: crosshair;
            user-select: none;
        }
        
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03) 0px,
                rgba(0,0,0,0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            animation: noiseMove 0.5s infinite;
        }
        
        @keyframes noiseMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }
        
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139,0,0,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 3s infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 90%;
            max-width: 500px;
        }
        
        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .header-title {
            font-family: var(--font-term);
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--text);
            position: relative;
            animation: textFlicker 2s infinite;
        }
        
        .header-title::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: var(--accent-bright);
            animation: glitch1 3s infinite linear alternate-reverse;
            opacity: 0.5;
        }
        
        @keyframes glitch1 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
            91% { clip-path: inset(10% 0 60% 0); transform: translateX(-3px); }
            93% { clip-path: inset(50% 0 20% 0); transform: translateX(3px); }
            95% { clip-path: inset(80% 0 5% 0); transform: translateX(-2px); }
            97% { clip-path: inset(30% 0 40% 0); transform: translateX(2px); }
        }
        
        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
            52% { opacity: 1; }
            54% { opacity: 0.7; }
            56% { opacity: 1; }
        }
        
        .header-sub {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        
        .lang-switcher {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .lang-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 5px 15px;
            font-family: var(--font-main);
            font-size: 0.7rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .lang-btn:hover,
        .lang-btn.active {
            color: var(--accent-bright);
            border-color: var(--accent);
        }
        
        .login-box {
            width: 100%;
            background: rgba(10,10,10,0.9);
            border: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .login-title {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .input-label {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        
        .login-input {
            background: var(--bg-darker);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 15px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            letter-spacing: 2px;
            outline: none;
            caret-color: var(--accent-bright);
            transition: border-color 0.3s;
        }
        
        .login-input:focus {
            border-color: var(--accent);
        }
        
        .login-btn {
            background: var(--bg-darker);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 14px 20px;
            font-family: var(--font-main);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-btn:hover {
            background: rgba(139,0,0,0.2);
            border-color: var(--accent-bright);
        }
        
        .login-error {
            text-align: center;
            font-size: 0.7rem;
            color: var(--accent-bright);
            min-height: 20px;
            display: none;
        }
        
        .login-footer {
            text-align: center;
            font-size: 0.55rem;
            color: #404040;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #0a0a0a;
            border: 1px solid var(--accent);
            padding: 40px;
            max-width: 90%;
            width: 500px;
            text-align: center;
            position: relative;
        }
        
        .modal-text {
            font-size: 0.9rem;
            letter-spacing: 2px;
            line-height: 1.6;
        }
        
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .login-container { gap: 25px; }
            .login-box { padding: 20px; }
            .header-title { letter-spacing: 3px; }
        }
        
        .dvd-hint {
            position: fixed;
            top: 0;
            left: 0;
            font-family: var(--font-term);
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: rgba(139, 0, 0, 0.15);
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            animation: dvdMove 12s linear infinite;
        }
        
        @keyframes dvdMove {
            0% {
                top: 0;
                left: 0;
            }
            25% {
                top: calc(100vh - 40px);
                left: calc(100vw - 250px);
            }
            50% {
                top: calc(100vh - 40px);
                left: 0;
            }
            75% {
                top: 0;
                left: calc(100vw - 250px);
            }
            100% {
                top: 0;
                left: 0;
            }
        }
        
    </style>
</head>
<body class="login-body">
    <div class="bg-noise"></div>
    <div class="bg-glow"></div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="header-title" data-text="ВОЗМЕЗДИЕ АИДА И КОСТИ">ВОЗМЕЗДИЕ АИДА И КОСТИ</div>
            <div class="header-sub">VZ // CASE FILE 81 // RESTRICTED ACCESS</div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="fr">FR</button>
            </div>
        </div>
        
        <div class="login-box">
            <div class="login-title">ВХОД В СИСТЕМУ</div>
            
            <div class="input-group">
                <div class="input-label">ЛОГИН</div>
                <input type="text" id="loginInput" class="login-input" placeholder="_ _ _ _ _ _ _ _ _ _" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
            
            <div class="input-group">
                <div class="input-label">ПАРОЛЬ</div>
                <input type="password" id="passwordInput" class="login-input" placeholder="_ _ _ _ _ _ _ _ _ _" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
            
            <button class="login-btn" id="loginBtn">АВТОРИЗАЦИЯ</button>
            
            <div class="login-error" id="loginError"></div>
        </div>
        
        <div class="login-footer">© 2024-2026 VZ // ВСЕ ПРАВА НЕ ЗАЩИЩЕНЫ</div>
    </div>
    
    <div class="modal" id="responseModal">
        <div class="modal-content">
            <div class="modal-text" id="modalText"></div>
            <button class="modal-close" id="modalClose">×</button>
        </div>
    </div>

        <div class="dvd-hint" id="dvdHint">VZ // 01.08.2024</div>
    <script src="audio.js"></script>
    
    <script>
        (function() {
            // Переключение языка
            const translations = {
                ru: {
                    title: 'ВОЗМЕЗДИЕ АИДА И КОСТИ',
                    sub: 'VZ // CASE FILE 81 // RESTRICTED ACCESS',
                    loginTitle: 'ВХОД В СИСТЕМУ',
                    loginLabel: 'ЛОГИН',
                    passwordLabel: 'ПАРОЛЬ',
                    loginBtn: 'АВТОРИЗАЦИЯ',
                    footer: '© 2024-2026 VZ // ВСЕ ПРАВА НЕ ЗАЩИЩЕНЫ',
                    errorEmpty: 'ВВЕДИТЕ ЛОГИН И ПАРОЛЬ',
                    errorWrong: 'НЕВЕРНЫЙ ЛОГИН ИЛИ ПАРОЛЬ'
                },
                en: {
                    title: 'REVENGE OF AID AND KOSTYA',
                    sub: 'VZ // CASE FILE 81 // RESTRICTED ACCESS',
                    loginTitle: 'SYSTEM ACCESS',
                    loginLabel: 'LOGIN',
                    passwordLabel: 'PASSWORD',
                    loginBtn: 'AUTHORIZE',
                    footer: '© 2024-2026 VZ // ALL RIGHTS NOT RESERVED',
                    errorEmpty: 'ENTER LOGIN AND PASSWORD',
                    errorWrong: 'INVALID LOGIN OR PASSWORD'
                },
                fr: {
                    title: 'VENGEANCE D\'AID ET KOSTYA',
                    sub: 'VZ // DOSSIER 81 // ACCÈS RESTREINT',
                    loginTitle: 'ACCÈS SYSTÈME',
                    loginLabel: 'IDENTIFIANT',
                    passwordLabel: 'MOT DE PASSE',
                    loginBtn: 'AUTORISER',
                    footer: '© 2024-2026 VZ // TOUS DROITS NON RÉSERVÉS',
                    errorEmpty: 'ENTREZ IDENTIFIANT ET MOT DE PASSE',
                    errorWrong: 'IDENTIFIANT OU MOT DE PASSE INCORRECT'
                }
            };
            
            let currentLang = 'ru';
            
            // Обработчик переключения языка
            document.querySelectorAll('.lang-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    currentLang = this.dataset.lang;
                    
                    document.querySelectorAll('.lang-btn').forEach(function(b) {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    updateLanguage();
                });
            });
            
            function updateLanguage() {
                const t = translations[currentLang];
                
                document.querySelector('.header-title').textContent = t.title;
                document.querySelector('.header-title').setAttribute('data-text', t.title);
                document.querySelector('.header-sub').textContent = t.sub;
                document.querySelector('.login-title').textContent = t.loginTitle;
                document.querySelectorAll('.input-label')[0].textContent = t.loginLabel;
                document.querySelectorAll('.input-label')[1].textContent = t.passwordLabel;
                document.querySelector('.login-btn').textContent = t.loginBtn;
                document.querySelector('.login-footer').textContent = t.footer;
            }
            
            // Счётчик попыток
            let attempts = parseInt(localStorage.getItem('vz_login_attempts') || '0');
            
            // Реакции на конкретные пароли
            const wrongPasswords = [
                { pwd: '12345', msg: 'БЛЯТЬ. СЕРЬЁЗНО? 12345?' },
                { pwd: 'qwerty', msg: 'QWERTY? ТЫ ЧТО, В 2007 ГОДУ?' },
                { pwd: 'password', msg: 'PASSWORD? ОРИГИНАЛЬНО. НЕТ.' },
                { pwd: 'admin', msg: 'АДМИН? АХАХАХ.' },
                { pwd: '123456', msg: '123456? это пиздец' },
                { pwd: '111111', msg: '111111? СЕРЬЁЗНО?' },
                { pwd: '000000', msg: '000000? НУ ТЫ И ЕБЛАН.' },
                { pwd: '67', msg: 'ты тупоголовый придурок нахуй.' },
                { pwd: '300', msg: 'Трактористом буду я, отсосешь ты у меня.' },
                { pwd: '52', msg: 'эй йоу' },
                { pwd: '42', msg: 'Кемеровская область.' },
                { pwd: '666', msg: 'Устраивает.' },
                { pwd: 'хуй', msg: 'ХУЙ? СМЕШНО. НО НЕТ.' },
                { pwd: 'блять', msg: 'БЛЯТЬ? ЭТО твоя мамаша, только не хватает буквы "Д".' },
                { pwd: 'сука', msg: 'СУКА? НЕТ. НО ДА. НО НЕТ.' },
                { pwd: 'пизда', msg: 'ПИЗДА? ХАХА. ТВОЯ.' },
                { pwd: 'sibirskaya', msg: 'СИБИРСКАЯ? ХОРОШАЯ ПОПЫТКА. НО НЕТ.' },
                { pwd: 'aidkostya', msg: 'АИД И КОСТЯ? ОНИ МЕРТВЫ. И ТЫ ТОЖЕ.' },
                { pwd: 'shaman', msg: 'ШАМАН? ОН ВИДИТ ТЕБЯ.' },
                { pwd: 'kapysta', msg: 'КАПУСТА? ЭТО НЕ ОВОЩ.' },
                { pwd: 'vitaly', msg: 'ВИТАЛИЙ? ОН ЗНАЕТ. НО МОЛЧИТ.' },
                { pwd: 'andrey', msg: 'АНДРЕЙ? ОН ВСЁ ЕЩЁ ЗДЕСЬ.' },
                { pwd: 'gvr', msg: 'GVR? НЕ ПЛОХО. НО НЕТ.' },
                { pwd: '01082024', msg: '01.08.2024? ДАТА ВЗРЫВА. НО НЕ СЮДА.' },
                { pwd: '25051999', msg: '25.05.1999? ДЕНЬ РОЖДЕНИЯ АИДА. НО НЕТ.' },
                { pwd: '04122002', msg: '04.12.2002? ДЕНЬ РОЖДЕНИЯ КОСТИ. НО НЕТ.' }
            ];
            
            // Реакции по количеству попыток
            const attemptReactions = [
                { min: 0, msg: 'НЕВЕРНЫЙ ЛОГИН ИЛИ ПАРОЛЬ.' },
                { min: 3, msg: 'НЕВЕРНО. ПОДУМАЙ ЕЩЁ.' },
                { min: 5, msg: 'ТЫ ИЗДЕВАЕШЬСЯ?' },
                { min: 8, msg: 'ПРЕКРАТИ. ТЫ НЕ УГАДАЕШЬ.' },
                { min: 12, msg: 'СЕРЬЁЗНО? ЕЩЁ ПОПЫТКИ?' },
                { min: 15, msg: 'МОЖЕТ, ПОДСКАЗАТЬ? НЕТ.' },
                { min: 20, msg: 'ТЕБЕ НЕ СТРАШНО? ОНИ СМОТРЯТ.' },
                { min: 25, msg: 'АИД СМЕЁТСЯ НАД ТОБОЙ.' },
                { min: 30, msg: 'КОСТЯ ТОЖЕ СМЕЁТСЯ.' },
                { min: 40, msg: 'ТЫ ВООБЩЕ УСТАЛ? НЕТ?' },
                { min: 50, msg: 'ПОЛТИННИК. НЕПЛОХО ДЛЯ ИДИОТА.' }
            ];
            
            // Обработка входа
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('passwordInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            
            function handleLogin() {
                const login = document.getElementById('loginInput').value.trim();
                const password = document.getElementById('passwordInput').value.trim();
                const errorEl = document.getElementById('loginError');
                const modal = document.getElementById('responseModal');
                const modalText = document.getElementById('modalText');
                
                if (!login || !password) {
                    errorEl.textContent = translations[currentLang].errorEmpty;
                    errorEl.style.display = 'block';
                    setTimeout(function() { errorEl.style.display = 'none'; }, 3000);
                    return;
                }
                
                // Проверка на конкретные тупые пароли
                for (let wp of wrongPasswords) {
                    if (password.toLowerCase() === wp.pwd.toLowerCase()) {
                        attempts++;
                        localStorage.setItem('vz_login_attempts', attempts.toString());
                        errorEl.textContent = wp.msg + ' [ПОПЫТКА ' + attempts + ']';
                        errorEl.style.display = 'block';
                        setTimeout(function() { errorEl.style.display = 'none'; }, 3000);
                        document.getElementById('passwordInput').value = '';
                        return;
                    }
                }
                
                // Правильные пароли
                const accessLevels = [
                    { login: 'VZ', pwd: '01082024', redirect: 'vz-archive.html', msg: 'ДОСТУП РАЗРЕШЁН.' },
                    { login: 'sibirskaya', pwd: '81', redirect: 'sibirskaya.html', msg: 'ДОСТУП К МАТЕРИАЛАМ СИБИРСКОЙ РАЗРЕШЁН.' },
                    { login: 'GVR', pwd: '1813', redirect: 'gvr.html', msg: 'ДОСТУП К ФАЙЛАМ GVR РАЗРЕШЁН.' },
                    { login: 'Andrey', pwd: '18062024', redirect: 'andrey.html', msg: 'ОГРАНИЧЕННЫЙ ДОСТУП РАЗРЕШЁН.' },
                    { login: 'ShamanKapysta', pwd: '020760', redirect: 'shaman.html', msg: 'ШАМАН КАПУСТА ПРИВЕТСТВУЕТ ТЕБЯ.' },
                    { login: 'AidKostya', pwd: '012812', redirect: 'aidkostya.html', msg: 'МЫ ВСЕГДА ЗДЕСЬ.' },
                    { login: 'Admin', pwd: '12345', redirect: 'admin.html', msg: 'ТЫ СЕРЬЁЗНО? БЛЯТЬ.' }
                ];
                
                let found = false;
                for (let level of accessLevels) {
                    if (level.login.toLowerCase() === login.toLowerCase() && level.pwd === password) {
                        found = true;
                        modalText.textContent = level.msg;
                        modal.classList.add('active');
                        
                        setTimeout(function() {
                            window.location.href = level.redirect;
                        }, 1500);
                        break;
                    }
                }
                
                if (!found) {
                    attempts++;
                    localStorage.setItem('vz_login_attempts', attempts.toString());
                    
                    let reaction = translations[currentLang].errorWrong;
                    for (let ar of attemptReactions) {
                        if (attempts >= ar.min) {
                            reaction = ar.msg + ' [ПОПЫТКА ' + attempts + ']';
                        }
                    }
                    
                    errorEl.textContent = reaction;
                    errorEl.style.display = 'block';
                    setTimeout(function() { errorEl.style.display = 'none'; }, 3000);
                    document.getElementById('passwordInput').value = '';
                    
                    if (attempts % 10 === 0) {
                        document.body.classList.add('glitch-flash');
                        setTimeout(function() { document.body.classList.remove('glitch-flash'); }, 300);
                    }
                }
            }
            
            // Закрытие модалки
            document.getElementById('modalClose').addEventListener('click', function() {
                document.getElementById('responseModal').classList.remove('active');
            });
        })();
    </script>
</body>
</html>
