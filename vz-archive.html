<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VZ // ARCHIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;700&display=swap');
        
        :root {
            --bg: #000000;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text: #e0e0e0;
            --text-dim: #808080;
            --text-faint: #404040;
            --accent: #8b0000;
            --accent-bright: #ff0000;
            --border: #1a1a1a;
            --font-main: 'IBM Plex Mono', 'Courier New', monospace;
            --font-term: 'VT323', 'Courier New', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
            user-select: none;
        }
        
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03) 0px,
                rgba(0,0,0,0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            animation: noiseMove 0.5s infinite;
        }
        
        @keyframes noiseMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .top-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .top-text {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        
        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 1rem;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-main);
        }
        
        .logout-btn:hover {
            color: var(--accent-bright);
            border-color: var(--accent);
        }
        
        .archive-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px 0;
        }
        
        .archive-title {
            font-family: var(--font-term);
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            letter-spacing: 5px;
            color: var(--text);
            animation: flicker 3s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            52% { opacity: 1; }
            54% { opacity: 0.6; }
            56% { opacity: 1; }
        }
        
        .archive-sub {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        
        .timer-box {
            background: rgba(10,10,10,0.7);
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
        }
        
        .timer-label {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .timer-display {
            font-family: var(--font-term);
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            color: var(--accent-bright);
            letter-spacing: 3px;
        }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .nav-card {
            background: rgba(10,10,10,0.7);
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .nav-card:hover {
            border-color: var(--accent);
            background: rgba(139,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .nav-label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .nav-desc {
            font-size: 0.55rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        
        .content-area {
            background: rgba(10,10,10,0.7);
            border: 1px solid var(--border);
            padding: 30px;
            min-height: 300px;
            display: none;
            margin-top: 10px;
        }
        
        .content-area.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .content-title {
            font-family: var(--font-term);
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: var(--accent-bright);
        }
        
        .file-card {
            background: rgba(5,5,5,0.8);
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        
        .file-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-dim);
        }
        
        .file-body {
            padding: 15px;
            font-size: 0.8rem;
            line-height: 1.6;
        }
        
        .file-body p {
            margin-bottom: 8px;
        }
        
        .file-body strong {
            color: var(--accent-bright);
        }
        
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .timeline-item {
            display: flex;
            gap: 15px;
            padding: 10px;
            border-left: 2px solid var(--accent);
            background: rgba(5,5,5,0.5);
        }
        
        .timeline-date {
            font-size: 0.7rem;
            color: var(--accent-bright);
            white-space: nowrap;
            font-weight: 700;
        }
        
        .timeline-text {
            font-size: 0.75rem;
            color: var(--text);
        }
        
        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .nav-card {
                padding: 15px;
            }
            
            .container {
                padding: 10px;
            }
            
            .content-area {
                padding: 20px;
            }
        }
        
        @media (max-width: 400px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="main-body">
    <div class="bg-noise"></div>
    
    <div class="container">
        <div class="top-bar">
            <div class="top-left">
                <span class="top-text" id="sessionInfo">SESSION: VZ_ARCHIVE</span>
                <span class="top-text" id="userInfo">USER: VZ</span>
                <span class="top-text" id="accessLevel">ACCESS LEVEL: MAIN</span>
            </div>
            <button class="logout-btn" id="logoutBtn">ВЫХОД</button>
        </div>
        
        <div class="archive-header">
            <div class="archive-title">АРХИВ ДЕЛА №81</div>
            <div class="archive-sub">СИБИРСКАЯ 81, НИЖНИЙ ТАГИЛ // 01.08.2024</div>
        </div>
        
        <div class="timer-box">
            <div class="timer-label">С МОМЕНТА ВЗРЫВА ПРОШЛО:</div>
            <div class="timer-display" id="timerDisplay">--:--:--:--</div>
        </div>
        
        <div class="nav-grid">
            <a href="#" class="nav-card" data-page="dossiers">
                <div class="nav-label">ДОСЬЕ</div>
                <div class="nav-desc">Файлы на Аида и Костю</div>
            </a>
            <a href="#" class="nav-card" data-page="chronology">
                <div class="nav-label">ХРОНОЛОГИЯ</div>
                <div class="nav-desc">18.06.2024 — 01.08.2024</div>
            </a>
            <a href="#" class="nav-card" data-page="evidence">
                <div class="nav-label">УЛИКИ</div>
                <div class="nav-desc">Материалы дела</div>
            </a>
            <a href="#" class="nav-card" data-page="terminal">
                <div class="nav-label">ТЕРМИНАЛ</div>
                <div class="nav-desc">Командный интерфейс</div>
            </a>
            <a href="#" class="nav-card" data-page="audio">
                <div class="nav-label">АУДИО</div>
                <div class="nav-desc">Записи</div>
            </a>
            <a href="#" class="nav-card" data-page="restricted">
                <div class="nav-label">ДОСТУП</div>
                <div class="nav-desc">Требуется пароль</div>
            </a>
        </div>
        
        <div class="content-area" id="contentArea"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
